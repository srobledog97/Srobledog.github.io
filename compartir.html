<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Baby Shower Ana Sofía 💜</title>


    <!-- ==============================
         OPEN GRAPH — WHATSAPP
    =============================== -->

    <meta property="og:title"
          content="Baby Shower Ana Sofía 💜">

    <meta property="og:description"
          content="Tenemos una invitación muy especial para ti 💜">

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://srobledog97.github.io/compartir.html">

    <!-- IMAGEN DE VISTA PREVIA -->

    <meta property="og:image"
          content="https://srobledog97.github.io/preview.jpg">

    <meta property="og:image:secure_url"
          content="https://srobledog97.github.io/preview.jpg">

    <meta property="og:image:type"
          content="image/jpeg">

    <meta property="og:image:width"
          content="1200">

    <meta property="og:image:height"
          content="630">

    <meta property="og:image:alt"
          content="Baby Shower Ana Sofía">


    <!-- ==============================
         TWITTER / REDES SOCIALES
    =============================== -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Baby Shower Ana Sofía 💜">

    <meta name="twitter:description"
          content="Tenemos una invitación muy especial para ti 💜">

    <meta name="twitter:image"
          content="https://srobledog97.github.io/preview.jpg">


    <!-- ==============================
         ESTILO
    =============================== -->

    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;

            background: #12091c;

        }


        .contenedor {

            width: 100%;

            max-width: 700px;

            margin: 0 auto;

        }


        .contenedor img {

            display: block;

            width: 100%;

            height: auto;

        }

    </style>

</head>


<body>

    <div class="contenedor">

        <img
            src="preview.jpg"
            alt="Baby Shower Ana Sofía 💜"
        >

    </div>


    <script>

        /*
        ==================================================
        OBTENER EL INVITADO
        ==================================================
        */

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const invitado =
            parametros.get("invitado");


        /*
        ==================================================
        REDIRECCIÓN
        ==================================================

        El parámetro "invitado" solamente sirve
        para llevar a la persona a su invitación
        personalizada.

        La vista previa de WhatsApp permanece
        siempre utilizando preview.jpg.
        */

        if (invitado) {

            setTimeout(function () {

                window.location.href =
                    "index.html?invitado=" +
                    encodeURIComponent(invitado);

            }, 800);

        }

        else {

            setTimeout(function () {

                window.location.href =
                    "index.html";

            }, 800);

        }

    </script>

</body>

</html>
