<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>Baby Shower Ana Sofía 💜</title>

    <meta name="description"
          content="Invitación Baby Shower Ana Sofía">

    <meta property="og:title"
          content="Baby Shower Ana Sofía 💜">

    <meta property="og:description"
          content="Invitación especial">

    <style>

        /* =====================================
           CONFIGURACIÓN GENERAL
        ====================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #12091d;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =====================================
           CONTENEDOR DE LA INVITACIÓN
        ====================================== */

        .invitacion {

            position: relative;

            width: 100vw;
            height: 100dvh;

            overflow: hidden;

            animation: entrada 0.8s ease-out;

        }


        /* =====================================
           IMAGEN
        ====================================== */

        .invitacion img {

            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            /*
              Fill permite que la invitación
              ocupe toda la pantalla.
            */

            object-fit: fill;

            display: block;

        }


        /* =====================================
           ZONAS TÁCTILES INVISIBLES
        ====================================== */

        .zona-boton {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            display: block;

            /*
              IMPORTANTE:
              El botón es transparente.
              El diseño que ves pertenece
              directamente a la imagen.
            */

            background: transparent;

            border: none;

            outline: none;

            -webkit-tap-highlight-color: transparent;

            cursor: pointer;

        }


        /* =====================================
           BOTÓN VER UBICACIÓN
        ====================================== */

        .ubicacion {

            width: 34%;

            height: 5.3%;

            bottom: 14.3%;

        }


        /* =====================================
           BOTÓN CONFIRMAR ASISTENCIA
        ====================================== */

        .confirmar {

            width: 34%;

            height: 5.3%;

            bottom: 8.3%;

        }


        /* =====================================
           EFECTO AL TOCAR
        ====================================== */

        .zona-boton:active {

            background: rgba(255,255,255,0.08);

            border-radius: 40px;

        }


        /* =====================================
           ANIMACIÓN DE ENTRADA
        ====================================== */

        @keyframes entrada {

            from {

                opacity: 0;

                transform: scale(0.98);

            }

            to {

                opacity: 1;

                transform: scale(1);

            }

        }


        /* =====================================
           PANTALLAS MUY PEQUEÑAS
        ====================================== */

        @media (max-height: 650px) {

            .ubicacion {

                bottom: 14.2%;

            }

            .confirmar {

                bottom: 8.2%;

            }

        }


        /* =====================================
           PANTALLAS ALTAS
        ====================================== */

        @media (min-height: 850px) {

            .ubicacion {

                bottom: 14.4%;

            }

            .confirmar {

                bottom: 8.4%;

            }

        }

    </style>

</head>


<body>


    <main class="invitacion">


        <!-- =================================
             IMAGEN ORIGINAL
        ================================== -->

        <img
            src="Invitacion.png"
            alt="Invitación Baby Shower Ana Sofía"
        >


        <!-- =================================
             ÁREA INVISIBLE GOOGLE MAPS
        ================================== -->

        <a
            class="zona-boton ubicacion"
            href="https://www.google.com/maps/search/?api=1&query=Sal%C3%B3n%20Social%20Punto%20Rojo"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ver ubicación"
        ></a>


        <!-- =================================
             ÁREA INVISIBLE WHATSAPP
        ================================== -->

        <a
            class="zona-boton confirmar"
            href="https://wa.me/?text=Hola%2C%20quiero%20confirmar%20mi%20asistencia%20al%20Baby%20Shower%20de%20Ana%20Sof%C3%ADa%20%F0%9F%92%9C"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Confirmar asistencia"
        ></a>


    </main>


</body>

</html>
