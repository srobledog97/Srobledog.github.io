<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Baby Shower Ana Sofía 💜</title>

    <meta name="description"
          content="Invitación Baby Shower Ana Sofía 💜">

    <!-- ==========================================
         VISTA PREVIA AL COMPARTIR
    =========================================== -->

    <meta property="og:title"
          content="Baby Shower Ana Sofía 💜">

    <meta property="og:description"
          content="Tenemos una invitación muy especial para ti 💜">

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://srobledog97.github.io/">

    <meta property="og:image"
          content="https://srobledog97.github.io/Invitacion.png">

    <meta property="og:image:alt"
          content="Invitación Baby Shower Ana Sofía">


    <style>

        /* ==========================================
           CONFIGURACIÓN GENERAL
        =========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #10071b;
        }

        body {
            overflow-x: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* ==========================================
           CONTENEDOR PRINCIPAL
        =========================================== */

        .invitacion {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            line-height: 0;
        }


        /* ==========================================
           IMAGEN ORIGINAL
        =========================================== */

        .imagen-invitacion {
            display: block;
            width: 100%;
            height: auto;
            border: 0;
        }


        /* ==========================================
           NOMBRE DEL INVITADO
        =========================================== */

        ..nombre-invitado {

    position: absolute;

    left: 50%;
    top: 68.8%;

    transform: translateX(-50%);

    width: 86%;

    text-align: center;

    color: #5b277d;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        "Lucida Handwriting",
        cursive;

    font-size: clamp(22px, 5vw, 34px);

    font-weight: 500;

    line-height: 1.15;

    white-space: normal;

    text-shadow:
        0 1px 1px rgba(255,255,255,0.45);

    z-index: 15;

    opacity: 0;

    transition: opacity 0.5s ease;
        }


        /* ==========================================
           TEXTO "CON CARIÑO PARA"
        =========================================== */


        /* ==========================================
           ZONAS INTERACTIVAS
           
           Los botones visuales ya están incluidos
           dentro de Invitacion.png.
           
           Estas zonas son invisibles.
        =========================================== */

        .boton-interactivo {

            position: absolute;

            display: block;

            background: transparent;

            border: none;

            box-shadow: none;

            color: transparent;

            text-decoration: none;

            font-size: 0;

            -webkit-tap-highlight-color: transparent;

            outline: none;

            cursor: pointer;

            z-index: 20;

        }


        /* ==========================================
           VER UBICACIÓN
        =========================================== */

        .ubicacion {

            left: 30%;

            width: 40%;

            top: 76.5%;

            height: 6.5%;

        }


        /* ==========================================
           CONFIRMAR ASISTENCIA
        =========================================== */

        .confirmar {

            left: 30%;

            width: 40%;

            top: 83%;

            height: 7%;

        }


        /* ==========================================
           TELÉFONOS
        =========================================== */

        @media (max-width: 480px) {

            .ubicacion {

                left: 29%;

                width: 42%;

                top: 76.5%;

                height: 6.5%;

            }

            .confirmar {

                left: 29%;

                width: 42%;

                top: 83%;

                height: 7%;

            }

        }


        @media (max-width: 360px) {

            .ubicacion {

                left: 27%;

                width: 46%;

            }

            .confirmar {

                left: 27%;

                width: 46%;

            }

        }

    </style>

</head>


<body>


    <main class="invitacion">


        <!-- ========================================
             IMAGEN PRINCIPAL
        ========================================= -->

        <img
            src="Invitacion.png"
            alt="Invitación Baby Shower Ana Sofía"
            class="imagen-invitacion"
        >


        <!-- ========================================
             NOMBRE PERSONALIZADO
        ========================================= -->

        <div
            id="nombreInvitado"
            class="nombre-invitado"
        ></div>


        <!-- ========================================
             BOTÓN INVISIBLE - GOOGLE MAPS
        ========================================= -->

        <a
            class="boton-interactivo ubicacion"
            href="https://maps.app.goo.gl/BGQ9y5GhA3HxYcNT8"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ver ubicación"
        >
            Ver ubicación
        </a>


        <!-- ========================================
             BOTÓN INVISIBLE - WHATSAPP
        ========================================= -->

        <a
            id="botonWhatsApp"
            class="boton-interactivo confirmar"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Confirmar asistencia"
        >
            Confirmar asistencia
        </a>


    </main>


    <script>

        /* ==================================================
           PERSONALIZACIÓN DE LA INVITACIÓN
        ================================================== */

        const parametros =
            new URLSearchParams(window.location.search);


        /* ==================================================
           OBTENER EL NOMBRE DESDE ?para=
        ================================================== */

        const nombre =
            parametros.get("para");


        const elementoNombre =
            document.getElementById("nombreInvitado");


        const botonWhatsApp =
            document.getElementById("botonWhatsApp");


        /* ==================================================
           SI EXISTE UN NOMBRE
        ================================================== */

        if (nombre && nombre.trim() !== "") {

            /*
             * Decodificamos correctamente caracteres
             * como á, é, í, ó, ú y ñ.
             */

            const nombreDecodificado =
                nombre.trim();


            /*
             * Mostramos el nombre.
             */

            elementoNombre.innerHTML =
                '<span class="texto-invitado">' +
                'Con cariño para' +
                '</span>' +
                nombreDecodificado;


            elementoNombre.classList.add("visible");


            /*
             * Mensaje personalizado de WhatsApp.
             */

            const mensaje =
                "Hola 👋, confirmo mi asistencia al Baby Shower de Ana Sofía 💜. " +
                "Invitación para: " +
                nombreDecodificado;


            /*
             * Construimos el enlace de WhatsApp.
             */

            botonWhatsApp.href =
                "https://wa.me/573142999978?text=" +
                encodeURIComponent(mensaje);

        }


        /* ==================================================
           SI NO HAY NOMBRE
        ================================================== */

        else {

            /*
             * Mensaje genérico.
             */

            const mensaje =
                "Hola 👋, quiero confirmar mi asistencia al Baby Shower de Ana Sofía 💜";


            botonWhatsApp.href =
                "https://wa.me/573142999978?text=" +
                encodeURIComponent(mensaje);

        }


        /* ==================================================
           EVITAR MENÚ CONTEXTUAL SOBRE LA INVITACIÓN
        ================================================== */

        document
            .querySelector(".imagen-invitacion")
            .addEventListener(
                "contextmenu",
                function(event) {

                    event.preventDefault();

                }
            );

    </script>


</body>

</html>
