        /* ==========================================
           CONFIGURACIÓN GENERAL

        * {
            margin: 0;

        }


        html {
            width: 100%;

        body {

            background: #10081d;

            overflow-x: hidden;

            font-family: Arial, sans-serif;
        }


        /* ==========================================
           CONTENEDOR PRINCIPAL
        =========================================== */

        .invitacion {

            position: relative;

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            line-height: 0;

            animation: aparecer 0.8s ease-out;

        }


        /* ==========================================
           IMAGEN ORIGINAL
        =========================================== */

        .imagen-invitacion {

            display: block;

            width: 100%;

            height: auto;

            max-width: 100%;

            margin: 0;

        }


        /* ==========================================
           CONTENEDOR DE LOS BOTONES
        =========================================== */

        .botones {

            position: absolute;

            left: 50%;

            bottom: 7.8%;

            transform: translateX(-50%);

            width: 34%;

            min-width: 210px;

            max-width: 330px;

            display: flex;

            flex-direction: column;

            gap: 10px;

            line-height: normal;

        }


        /* ==========================================
           BOTONES
        =========================================== */

        .boton {

            width: 100%;

            min-height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 11px 18px;

            border-radius: 30px;

            background:
                linear-gradient(
                    to bottom,
                    #8e4be0,
                    #6d2cc4
                );

            border: 2px solid rgba(255,255,255,0.35);

            box-shadow:
                0 4px 10px rgba(50,15,80,0.35),
                inset 0 1px 2px rgba(255,255,255,0.25);

            color: white;

            text-decoration: none;

            font-size: clamp(14px, 1.8vw, 19px);

            font-weight: 500;

            letter-spacing: 0.2px;

            cursor: pointer;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                filter 0.18s ease;

        }


        .boton:hover {

            filter: brightness(1.08);

            box-shadow:
                0 6px 14px rgba(50,15,80,0.45),
                inset 0 1px 2px rgba(255,255,255,0.3);

        }


        .boton:active {

            transform: scale(0.97);

        }


        /* ==========================================
           ICONOS
        =========================================== */

        .icono {

            width: 25px;

            height: 25px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

            line-height: 1;

        }


        /* ==========================================
           ANIMACIÓN DE LOS BOTONES
        =========================================== */

        .boton {

            animation: subir 0.8s ease-out 0.4s both;

        }


        @keyframes subir {

            from {

                opacity: 0;

                transform: translateY(12px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        /* ==========================================
           ANIMACIÓN DE ENTRADA
        =========================================== */

        @keyframes aparecer {

            from {

                opacity: 0;

            }

            to {

                opacity: 1;

            }

        }


        /* ==========================================
           CELULARES
        =========================================== */

        @media (max-width: 600px) {
