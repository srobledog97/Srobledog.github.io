<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baby Shower Ana Sofía 💜</title>

<meta name="description"
content="Invitación al Baby Shower de Ana Sofía">

<!-- Vista previa de WhatsApp -->
<meta property="og:title"
content="Baby Shower Ana Sofía 💜">

<meta property="og:description"
content="Acompáñanos a celebrar un dulce Baby Shower">

<meta property="og:type"
content="website">

<meta property="og:url"
content="https://srobledog97.github.io/">

<meta property="og:image"
content="https://srobledog97.github.io/Invitacion.png">

<meta property="og:image:alt"
content="Invitación Baby Shower Ana Sofía">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #120b1f;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
}

.invitacion {
    position: relative;
    width: min(100vw, 1024px);
    aspect-ratio: 2 / 3;
    overflow: hidden;
    background: #f5e8dc;
}

.invitacion img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

.zona-boton {
    position: absolute;
    display: block;
    z-index: 10;
    cursor: pointer;
    border-radius: 50px;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
}

.ubicacion {
    left: 31%;
    width: 39%;
    top: 76.4%;
    height: 5.8%;
}

.confirmar {
    left: 31%;
    width: 39%;
    top: 82.2%;
    height: 5.8%;
}

.zona-boton:active {
    transform: scale(0.97);
}

.cargando {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5e8dc;
    z-index: 20;
    font-family: Arial, sans-serif;
    color: #6d4784;
    font-size: 14px;
    transition: opacity 0.4s ease;
}

.cargando.oculto {
    opacity: 0;
    pointer-events: none;
}

@media (max-width: 600px) {

    .invitacion {
        width: 100vw;
    }

}

@media (min-width: 1025px) {

    body {
        padding: 25px 0;
    }

    .invitacion {
        border-radius: 8px;
        box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.45);
    }

}

</style>
</head>

<body>

<main class="invitacion">

<div class="cargando" id="cargando">
Preparando tu invitación... 💜
</div>

<img
src="Invitacion.png"
alt="Invitación Baby Shower Ana Sofía"
id="imagenInvitacion"
>

<!-- BOTÓN VER UBICACIÓN -->

<a
class="zona-boton ubicacion"
href="https://www.google.com/maps/search/?api=1&query=Salon+Social+Punto+Rojo"
target="_blank"
rel="noopener noreferrer"
aria-label="Ver ubicación del Baby Shower">
</a>

<!-- BOTÓN CONFIRMAR ASISTENCIA -->

<a
class="zona-boton confirmar"
href="https://wa.me/?text=Hola%2C%20quiero%20confirmar%20mi%20asistencia%20al%20Baby%20Shower%20de%20Ana%20Sof%C3%ADa.%20%F0%9F%92%9C"
target="_blank"
rel="noopener noreferrer"
aria-label="Confirmar asistencia por WhatsApp">
</a>

</main>

<script>

const imagen = document.getElementById("imagenInvitacion");
const cargando = document.getElementById("cargando");

function ocultarCarga() {
    cargando.classList.add("oculto");
}

if (imagen.complete) {
    ocultarCarga();
} else {
    imagen.addEventListener("load", ocultarCarga);
}

</script>

</body>
</html>
