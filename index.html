<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Baby Shower Ana Sofía 💜</title>

    <!-- Vista previa al compartir -->

    <meta property="og:title"
          content="Baby Shower Ana Sofía 💜">

    <meta property="og:description"
          content="Tenemos una invitación muy especial para ti 💜">

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://srobledog97.github.io/">

    <meta property="og:image"
          content="https://srobledog97.github.io/Invitacion.png">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            background: #12091c;
            overflow-x: hidden;
        }


        /* =====================================
           INVITACIÓN
           ===================================== */

        .invitacion {

            position: relative;

            width: 100%;

            max-width: 700px;

            margin: 0 auto;

            line-height: 0;

        }


        /* =====================================
           IMAGEN ORIGINAL
           ===================================== */

        .imagen {

            display: block;

            width: 100%;

            height: auto;

        }


        /* =====================================
           NOMBRE DEL INVITADO
           ===================================== */

        .nombre-invitado {

            position: absolute;

            /*
             * POSICIÓN DEL NOMBRE
             *
             * Esta es la zona donde debe
             * aparecer el nombre del invitado.
             */

            top: 10%;

            left: 3%;

            width: 94%;

            padding: 0 5px;

            text-align: center;

            line-height: 1.15;

            color: #65418c;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    18px,
                    4.5vw,
                    29px
                );

            font-weight: bold;

            text-shadow:
                0 1px 1px
                rgba(255,255,255,0.55);

            z-index: 5;

            pointer-events: none;

        }


        /* =====================================
           BOTÓN INVISIBLE DE GOOGLE MAPS
           
           NO CAMBIA SU APARIENCIA.
           SOLO HACE CLICKEABLE EL BOTÓN
           QUE YA ESTÁ DENTRO DE LA IMAGEN.
           ===================================== */

        .boton-maps {

            position: absolute;

            top: 76.1%;

            left: 29%;

            width: 42%;

            height: 5.7%;

            z-index: 10;

            display: block;

            background: transparent;

            border: none;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =====================================
           BOTÓN INVISIBLE DE WHATSAPP
           ===================================== */

        .boton-whatsapp {

            position: absolute;

            top: 82.1%;

            left: 29%;

            width: 42%;

            height: 5.7%;

            z-index: 10;

            display: block;

            background: transparent;

            border: none;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =====================================
           PANTALLAS PEQUEÑAS
           ===================================== */

        @media (max-width: 500px) {

            .nombre-invitado {

                top: 55.2%;

                left: 3%;

                width: 94%;

                font-size:
                    clamp(
                        17px,
                        4.5vw,
                        26px
                    );

            }


            /*
             * IMPORTANTE:
             * NO MODIFICAMOS LAS ZONAS
             * DE LOS BOTONES.
             */

            .boton-maps {

                top: 76.1%;

                left: 29%;

                width: 42%;

                height: 5.7%;

            }


            .boton-whatsapp {

                top: 82.1%;

                left: 29%;

                width: 42%;

                height: 5.7%;

            }

        }


        @media (max-width: 360px) {

            .nombre-invitado {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


    <main class="invitacion">


        <!-- =================================
             IMAGEN DE LA INVITACIÓN
             ================================= -->

        <img
            src="Invitacion.png"
            alt="Baby Shower Ana Sofía"
            class="imagen"
        >


        <!-- =================================
             NOMBRE PERSONALIZADO
             
             NO EXISTE "CON CARIÑO PARA:"
             ================================= -->

        <div
            id="nombreInvitado"
            class="nombre-invitado">
        </div>


        <!-- =================================
             GOOGLE MAPS
             ================================= -->

        <a
            class="boton-maps"
            href="https://maps.app.goo.gl/BGQ9y5GhA3HxYcNT8"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ver ubicación">
        </a>


        <!-- =================================
             WHATSAPP
             ================================= -->

        <a
            class="boton-whatsapp"
            href="https://wa.me/573142999978"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Confirmar asistencia">
        </a>


    </main>


    <script>

        /* =====================================
           NOMBRE PREDETERMINADO PARA LA PRUEBA
           ===================================== */

        const nombrePrueba =
            "Flia. Montoya Agudelo";


        /* =====================================
           LEER EL NOMBRE DESDE EL ENLACE
           ===================================== */

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        let invitado =
            parametros.get("invitado");


        /*
         * Si el enlace tiene un invitado,
         * usamos ese nombre.
         *
         * Si no tiene ninguno,
         * usamos Montoya Agudelo
         * como prueba.
         */

        if (!invitado) {

            invitado =
                nombrePrueba;

        }


        /* =====================================
           CONVERTIR "FAMILIA" EN "FLIA."
           ===================================== */

        invitado =
            invitado.replace(
                /^Familia\s+/i,
                "Flia. "
            );


        /* =====================================
           MOSTRAR EL NOMBRE
           ===================================== */

        const elemento =
            document.getElementById(
                "nombreInvitado"
            );


        elemento.textContent =
            invitado.trim();

    </script>


</body>

</html>
