<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Baby Shower Ana Sofía 💜</title>

    <meta name="description"
          content="Invitación Baby Shower Ana Sofía">

    <style>

        /* ==============================
           CONFIGURACIÓN GENERAL
        =============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            background: #12091d;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            margin: 0;
            padding: 0;

            background: #12091d;

            overflow-x: hidden;
        }


        /* ==============================
           CONTENEDOR
        =============================== */

        .invitacion {

            position: relative;

            width: 100%;
            max-width: 700px;

            margin: 0 auto;

            line-height: 0;

        }


        /* ==============================
           IMAGEN ORIGINAL
        =============================== */

        .invitacion img {

            display: block;

            width: 100%;

            height: auto;

            max-width: 100%;

            margin: 0;

        }


        /* ==============================
           ZONAS INVISIBLES
        =============================== */

        .zona-boton {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            display: block;

            background: transparent;

            border: none;

            outline: none;

            z-index: 20;

            -webkit-tap-highlight-color: transparent;

        }


        /* ==============================
           VER UBICACIÓN
           
           Esta zona se coloca encima
           del botón que ya existe
           dentro de la imagen.
        =============================== */

        .ubicacion {

            width: 46%;

            height: 5.8%;

            bottom: 14.2%;

        }


        /* ==============================
           CONFIRMAR ASISTENCIA
        =============================== */

        .confirmar {

            width: 46%;

            height: 5.8%;

            bottom: 7.8%;

        }


        /* ==============================
           EFECTO TÁCTIL
        =============================== */

        .zona-boton:active {

            background: rgba(255, 255, 255, 0.06);

            border-radius: 50px;

        }


        /* ==============================
           ANIMACIÓN SUAVE
        =============================== */

        .invitacion {

            animation: aparecer 0.8s ease-out;

        }


        @keyframes aparecer {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        /* ==============================
           CELULARES
        =============================== */

        @media (max-width: 700px) {

            .invitacion {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <main class="invitacion">


        <!-- ==================================
             IMAGEN ORIGINAL DE LA INVITACIÓN
        =================================== -->

        <img
            src="Invitacion.png"
            alt="Baby Shower Ana Sofía"
        >


        <!-- ==================================
             ZONA INVISIBLE GOOGLE MAPS
        =================================== -->

        <a
            class="zona-boton ubicacion"
            href="https://www.google.com/maps/search/?api=1&query=Sal%C3%B3n%20Social%20Punto%20Rojo"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ver ubicación"
        ></a>


        <!-- ==================================
             ZONA INVISIBLE WHATSAPP
        =================================== -->

        <a
            class="zona-boton confirmar"
            href="https://wa.me/?text=Hola%2C%20quiero%20confirmar%20mi%20asistencia%20al%20Baby%20Shower%20de%20Ana%20Sof%C3%ADa%20%F0%9F%92%9C"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Confirmar asistencia"
        ></a>


    </main>


</body>

</html>
