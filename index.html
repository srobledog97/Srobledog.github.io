<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Baby Shower Ana Sofía 💜</title>


    <!-- ==================================================
         VISTA PREVIA PARA WHATSAPP / REDES SOCIALES
         ================================================== -->

    <meta property="og:title"
          content="Baby Shower Ana Sofía 💜">

    <meta property="og:description"
          content="Tenemos una invitación muy especial para ti 💜">

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://srobledog97.github.io/">

    <!-- Imagen que aparecerá en la vista previa -->

    <meta property="og:image"
          content="https://srobledog97.github.io/Invitacion.png">

    <meta property="og:image:secure_url"
          content="https://srobledog97.github.io/Invitacion.png">

    <meta property="og:image:type"
          content="image/png">

    <meta property="og:image:alt"
          content="Invitación Baby Shower Ana Sofía">

    <!-- Tamaño recomendado para compartir -->

    <meta property="og:image:width"
          content="1200">

    <meta property="og:image:height"
          content="1600">


    <!-- ==================================================
         TWITTER / X
         ================================================== -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Baby Shower Ana Sofía 💜">

    <meta name="twitter:description"
          content="Tenemos una invitación muy especial para ti 💜">

    <meta name="twitter:image"
          content="https://srobledog97.github.io/Invitacion.png">


    <style>

        /* ==================================================
           CONFIGURACIÓN GENERAL
           ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;

            min-height: 100%;

        }


        body {

            background: #12091c;

            overflow-x: hidden;

        }


        /* ==================================================
           CONTENEDOR PRINCIPAL
           ================================================== */

        .invitacion {

            position: relative;

            width: 100%;

            max-width: 700px;

            margin: 0 auto;

            line-height: 0;

        }


        /* ==================================================
           IMAGEN ORIGINAL
           ================================================== */

        .imagen {

            display: block;

            width: 100%;

            height: auto;

        }


        /* ==================================================
           NOMBRE DEL INVITADO
           ================================================== */

        .nombre-invitado {

            position: absolute;

            /*
             * POSICIÓN DEFINITIVA
             *
             * Esta es la posición que tú
             * comprobaste que funciona.
             */

            top: 70%;

            left: 5%;

            width: 90%;

            text-align: center;

            line-height: 1.15;

            color: #65418c;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    18px,
                    4.5vw,
                    30px
                );

            font-weight: bold;

            z-index: 5;

            pointer-events: none;

        }


        /* ==================================================
           BOTÓN INVISIBLE GOOGLE MAPS
           
           El botón visual NO se crea aquí.
           Está dentro de Invitacion.png.
           
           Esta zona solamente hace que sea pulsable.
           ================================================== */

        .boton-maps {

            position: absolute;

            top: 76.1%;

            left: 29%;

            width: 42%;

            height: 5.7%;

            z-index: 10;

            display: block;

            background: transparent;

            border: none;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* ==================================================
           BOTÓN INVISIBLE WHATSAPP
           
           El aspecto visual también pertenece
           a Invitacion.png.
           ================================================== */

        .boton-whatsapp {

            position: absolute;

            top: 82.1%;

            left: 29%;

            width: 42%;

            height: 5.7%;

            z-index: 10;

            display: block;

            background: transparent;

            border: none;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* ==================================================
           MÓVILES
           ================================================== */

        @media (max-width: 500px) {

            .nombre-invitado {

                /*
                 * IMPORTANTE:
                 * Conservamos exactamente 70%.
                 */

                top: 70%;

                left: 4%;

                width: 92%;

                font-size:
                    clamp(
                        17px,
                        4.5vw,
                        27px
                    );

            }


            /*
             * NO MODIFICAMOS LOS BOTONES
             */

            .boton-maps {

                top: 76.1%;

                left: 29%;

                width: 42%;

                height: 5.7%;

            }


            .boton-whatsapp {

                top: 82.1%;

                left: 29%;

                width: 42%;

                height: 5.7%;

            }

        }


        /* ==================================================
           PANTALLAS MUY PEQUEÑAS
           ================================================== */

        @media (max-width: 360px) {

            .nombre-invitado {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


    <main class="invitacion">


        <!-- ==================================================
             IMAGEN DE LA INVITACIÓN
             ================================================== -->

        <img
            src="Invitacion.png"
            class="imagen"
            alt="Invitación Baby Shower Ana Sofía"
        >


        <!-- ==================================================
             NOMBRE PERSONALIZADO
             ================================================== -->

        <div
            id="nombreInvitado"
            class="nombre-invitado">
        </div>


        <!-- ==================================================
             GOOGLE MAPS
             ================================================== -->

        <a
            class="boton-maps"
            href="https://maps.app.goo.gl/BGQ9y5GhA3HxYcNT8"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ver ubicación">
        </a>


        <!-- ==================================================
             WHATSAPP
             ================================================== -->

        <a
            id="botonWhatsApp"
            class="boton-whatsapp"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Confirmar asistencia">
        </a>


    </main>


    <script>


        /* ==================================================
           OBTENER INVITADO DE LA URL
           ================================================== */

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        let invitado =
            parametros.get("invitado");


        /* ==================================================
           NOMBRE DE PRUEBA
           
           Si se abre la página sin ?invitado=
           utilizamos este nombre.
           ================================================== */

        if (!invitado ||
            invitado.trim() === "") {

            invitado =
                "Familia Montoya Agudelo";

        }


        /* ==================================================
           DECODIFICAR NOMBRE
           ================================================== */

        try {

            invitado =
                decodeURIComponent(
                    invitado
                );

        } catch (error) {

            /*
             * Si ya estaba correctamente
             * decodificado, no hacemos nada.
             */

        }


        /* ==================================================
           FAMILIA → FLIA.
           ================================================== */

        invitado =
            invitado.replace(
                /^Familia\s+/i,
                "Flia. "
            );


        /* ==================================================
           LIMPIAR ESPACIOS
           ================================================== */

        invitado =
            invitado.trim();


        /* ==================================================
           MOSTRAR NOMBRE
           ================================================== */

        document
            .getElementById(
                "nombreInvitado"
            )
            .textContent =
                invitado;


        /* ==================================================
           CONFIGURACIÓN WHATSAPP
           ================================================== */

        const numeroWhatsApp =
            "573142999978";


        /* ==================================================
           MENSAJE PERSONALIZADO
           ================================================== */

        const mensaje =
            "Hola 👋, quiero confirmar mi " +
            "asistencia al Baby Shower de " +
            "Ana Sofía 💜. Soy " +
            invitado +
            ".";


        /* ==================================================
           CREAR ENLACE WHATSAPP
           ================================================== */

        const enlaceWhatsApp =
            "https://wa.me/" +
            numeroWhatsApp +
            "?text=" +
            encodeURIComponent(
                mensaje
            );


        /* ==================================================
           ASIGNAR ENLACE AL BOTÓN
           ================================================== */

        document
            .getElementById(
                "botonWhatsApp"
            )
            .href =
                enlaceWhatsApp;


    </script>


</body>

</html>
