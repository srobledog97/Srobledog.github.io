<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Baby Shower Ana Sofía 💜</title>

    <!-- Vista previa al compartir -->

    <meta property="og:title"
          content="Baby Shower Ana Sofía 💜">

    <meta property="og:description"
          content="Tenemos una invitación muy especial para ti 💜">

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://srobledog97.github.io/">

    <meta property="og:image"
          content="https://srobledog97.github.io/Invitacion.png">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            min-height: 100%;

        }


        body {

            background: #12091c;

            overflow-x: hidden;

        }


        /* =====================================
           CONTENEDOR DE LA INVITACIÓN
           ===================================== */

        .invitacion {

            position: relative;

            width: 100%;

            max-width: 700px;

            margin: 0 auto;

            line-height: 0;

        }


        /* =====================================
           IMAGEN ORIGINAL
           ===================================== */

        .imagen {

            display: block;

            width: 100%;

            height: auto;

        }


        /* =====================================
           NOMBRE DEL INVITADO
           ===================================== */

        .nombre-invitado {

            position: absolute;

            /*
             * Ubicación del nombre
             */

            top: 67.3%;

            left: 4%;

            width: 92%;

            text-align: center;

            line-height: 1.15;

            color: #65418c;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(
                18px,
                4.4vw,
                29px
            );

            font-weight: bold;

            text-shadow:
                0 1px 1px
                rgba(255,255,255,0.5);

            z-index: 5;

            pointer-events: none;

        }


        /* =====================================
           ÁREA TRANSPARENTE GOOGLE MAPS
           
           NO SE VE.
           
           SOLAMENTE HACE CLICKEABLE
           EL BOTÓN QUE YA ESTÁ EN LA IMAGEN.
           ===================================== */

        .boton-maps {

            position: absolute;

            /*
             * Posición aproximada del botón
             * original de la imagen.
             */

            top: 76.2%;

            left: 30%;

            width: 40%;

            height: 5.5%;

            z-index: 10;

            display: block;

            background: transparent;

            border: none;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =====================================
           ÁREA TRANSPARENTE WHATSAPP
           
           TAMPOCO SE VE.
           ===================================== */

        .boton-whatsapp {

            position: absolute;

            top: 82.2%;

            left: 30%;

            width: 40%;

            height: 5.5%;

            z-index: 10;

            display: block;

            background: transparent;

            border: none;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =====================================
           TELÉFONOS PEQUEÑOS
           ===================================== */

        @media (max-width: 500px) {

            .nombre-invitado {

                top: 67.3%;

                left: 3%;

                width: 94%;

                font-size:
                    clamp(
                        17px,
                        4.5vw,
                        26px
                    );

            }


            .boton-maps {

                top: 76.1%;

                left: 29%;

                width: 42%;

                height: 5.7%;

            }


            .boton-whatsapp {

                top: 82.1%;

                left: 29%;

                width: 42%;

                height: 5.7%;

            }

        }


        /* =====================================
           TELÉFONOS MUY PEQUEÑOS
           ===================================== */

        @media (max-width: 360px) {

            .nombre-invitado {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


    <main class="invitacion">


        <!-- =================================
             IMAGEN COMPLETA
             ================================= -->

        <img
            src="Invitacion.png"
            alt="Baby Shower Ana Sofía"
            class="imagen"
        >


        <!-- =================================
             NOMBRE PERSONALIZADO
             
             NO HAY "CON CARIÑO PARA:"
             ================================= -->

        <div
            id="nombreInvitado"
            class="nombre-invitado">
        </div>


        <!-- =================================
             BOTÓN INVISIBLE SOBRE
             EL BOTÓN ORIGINAL
             ================================= -->

        <a
            class="boton-maps"
            href="https://maps.app.goo.gl/BGQ9y5GhA3HxYcNT8"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ver ubicación">
        </a>


        <!-- =================================
             BOTÓN INVISIBLE SOBRE
             EL BOTÓN ORIGINAL
             ================================= -->

        <a
            class="boton-whatsapp"
            href="https://wa.me/573142999978"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Confirmar asistencia">
        </a>


    </main>


    <script>


        /* =====================================
           OBTENER INVITADO DESDE LA URL
           ===================================== */

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        let invitado =
            parametros.get("invitado");


        const elementoNombre =
            document.getElementById(
                "nombreInvitado"
            );


        /* =====================================
           SI EXISTE INVITADO
           ===================================== */

        if (invitado) {


            /*
             * Decodificar caracteres especiales
             */

            invitado =
                decodeURIComponent(
                    invitado
                );


            /*
             * Cambiar:
             *
             * Familia Montoya Agudelo
             *
             * por:
             *
             * Flia. Montoya Agudelo
             */

            invitado =
                invitado.replace(
                    /^Familia\s+/i,
                    "Flia. "
                );


            /*
             * Mostrar nombre
             */

            elementoNombre.textContent =
                invitado.trim();


        } else {


            /*
             * Si no hay invitado,
             * no mostrar ningún texto.
             */

            elementoNombre.style.display =
                "none";

        }


    </script>


</body>

</html>
