<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Baby Shower Ana Sofía 💜</title>

    <!-- Vista previa al compartir -->
    <meta property="og:title"
          content="Baby Shower Ana Sofía 💜">

    <meta property="og:description"
          content="Tenemos una invitación muy especial para ti 💜">

    <meta property="og:type"
          content="website">

    <meta property="og:url"
          content="https://srobledog97.github.io/">

    <meta property="og:image"
          content="https://srobledog97.github.io/Invitacion.png">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #12091c;
            font-family: Georgia, "Times New Roman", serif;
            overflow-x: hidden;
        }

        /* CONTENEDOR PRINCIPAL */

        .invitacion {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
        }

        /* IMAGEN */

        .imagen-invitacion {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ZONA INFERIOR SOBRE LA IMAGEN */

        .zona-invitados {
            position: absolute;

            /*
             * Esta posición mantiene el nombre
             * en la zona donde estaba originalmente.
             */
            left: 0;
            right: 0;
            top: 58.5%;

            text-align: center;
            padding: 0 20px;
        }

        /* NOMBRE DEL INVITADO */

        .nombre-invitado {
            color: #65418c;

            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(19px, 4.6vw, 30px);

            font-weight: bold;

            line-height: 1.15;

            text-align: center;

            text-shadow:
                0 1px 1px rgba(255,255,255,0.5);

            max-width: 95%;
            margin: 0 auto;
        }

        /*
         * BOTONES
         *
         * Diseño similar al original:
         * compactos, horizontales y separados.
         */

        .botones {
            margin-top: 62px;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 10px;

            width: 100%;
        }

        .boton {
            width: 220px;
            height: 56px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            border: none;

            border-radius: 30px;

            background:
                linear-gradient(
                    180deg,
                    #874bd1 0%,
                    #7134b5 100%
                );

            color: white;

            text-decoration: none;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;

            font-weight: 400;

            letter-spacing: 0.2px;

            box-shadow:
                0 3px 7px rgba(43, 15, 75, 0.35);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .boton:hover {
            transform: translateY(-1px);

            box-shadow:
                0 5px 10px rgba(43, 15, 75, 0.4);
        }

        .boton:active {
            transform: scale(0.97);
        }

        /* ICONOS */

        .icono {
            width: 25px;
            height: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;

            line-height: 1;
        }

        /* Ajuste específico del corazón */

        .icono-corazon {
            font-size: 25px;
            font-family: Arial, sans-serif;
        }

        /* TEXTO DE LOS BOTONES */

        .texto-boton {
            white-space: nowrap;
        }

        /* MÓVILES */

        @media (max-width: 500px) {

            .zona-invitados {
                top: 58.5%;
                padding: 0 12px;
            }

            .nombre-invitado {
                font-size: clamp(18px, 4.8vw, 26px);
            }

            .botones {
                margin-top: 62px;
                gap: 10px;
            }

            .boton {
                width: 220px;
                height: 55px;

                font-size: 14px;
            }
        }

        /* PANTALLAS MUY PEQUEÑAS */

        @media (max-width: 360px) {

            .boton {
                width: 205px;
                height: 52px;

                font-size: 13px;
            }

            .nombre-invitado {
                font-size: 18px;
            }
        }

    </style>
</head>


<body>

    <main class="invitacion">

        <!-- IMAGEN PRINCIPAL -->
        <img
            src="Invitacion.png"
            alt="Invitación Baby Shower Ana Sofía"
            class="imagen-invitacion"
        >


        <!-- NOMBRE PERSONALIZADO -->

        <section class="zona-invitados">

            <div
                id="nombreInvitado"
                class="nombre-invitado">
            </div>


            <!-- BOTONES -->

            <div class="botones">

                <!-- GOOGLE MAPS -->

                <a
                    class="boton"
                    href="https://maps.app.goo.gl/BGQ9y5GhA3HxYcNT8"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <span class="icono">📍</span>

                    <span class="texto-boton">
                        VER UBICACIÓN
                    </span>

                </a>


                <!-- WHATSAPP -->

                <a
                    class="boton"
                    href="https://wa.me/573142999978"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <span
                        class="icono icono-corazon">
                        ♡
                    </span>

                    <span class="texto-boton">
                        CONFIRMAR ASISTENCIA
                    </span>

                </a>

            </div>

        </section>

    </main>


    <script>

        /*
         * PERSONALIZACIÓN DEL INVITADO
         *
         * Ejemplo:
         *
         * https://srobledog97.github.io/?invitado=Familia%20Montoya%20Agudelo
         *
         */


        function obtenerInvitado() {

            const parametros =
                new URLSearchParams(
                    window.location.search
                );

            let invitado =
                parametros.get("invitado");


            if (!invitado) {

                return "";

            }


            /*
             * Cambiar automáticamente
             *
             * Familia → Flia.
             */

            invitado =
                invitado.replace(
                    /^Familia\s+/i,
                    "Flia. "
                );


            return invitado.trim();

        }


        const invitado =
            obtenerInvitado();


        const nombre =
            document.getElementById(
                "nombreInvitado"
            );


        if (invitado) {

            nombre.textContent =
                invitado;

        } else {

            nombre.style.display =
                "none";

        }

    </script>

</body>
</html>
