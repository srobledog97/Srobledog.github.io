<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Baby Shower Ana Sofía 💜</title>

  <!-- Vista previa al compartir -->
  <meta property="og:title" content="Baby Shower Ana Sofía 💜">
  <meta property="og:description" content="Tenemos una invitación muy especial para ti">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://srobledog97.github.io/">
  <meta property="og:image" content="https://srobledog97.github.io/Invitacion.png">

  <style>

    /* =====================================================
       CONFIGURACIÓN GENERAL
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #10071b;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }


    /* =====================================================
       CONTENEDOR PRINCIPAL
       ===================================================== */

    .invitacion {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      line-height: 0;
    }


    /* =====================================================
       IMAGEN PRINCIPAL
       ===================================================== */

    .imagen-invitacion {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }


    /* =====================================================
       ZONAS INTERACTIVAS
       
       IMPORTANTE:
       Los botones visuales ya están incluidos dentro
       de Invitacion.png.

       Por eso estas zonas son INVISIBLES.
       Solo sirven para hacer clic/tocar.
       ===================================================== */

    .boton-interactivo {
      position: absolute;
      display: block;

      /* Invisible */
      background: transparent;
      border: none;
      box-shadow: none;

      /* Elimina cualquier apariencia */
      color: transparent;
      text-decoration: none;
      font-size: 0;

      /* Evita selección */
      -webkit-tap-highlight-color: transparent;
      outline: none;

      cursor: pointer;

      z-index: 10;
    }


    /* =====================================================
       BOTÓN VER UBICACIÓN
       
       Coincide con el botón morado que está dentro
       de la imagen.
       ===================================================== */

    .ubicacion {
      left: 30%;
      width: 40%;

      top: 76.5%;
      height: 6.5%;
    }


    /* =====================================================
       BOTÓN CONFIRMAR ASISTENCIA
       ===================================================== */

    .confirmar {
      left: 30%;
      width: 40%;

      top: 83%;
      height: 7%;
    }


    /* =====================================================
       AJUSTES PARA PANTALLAS PEQUEÑAS
       ===================================================== */

    @media (max-width: 480px) {

      .ubicacion {
        left: 29%;
        width: 42%;

        top: 76.5%;
        height: 6.5%;
      }

      .confirmar {
        left: 29%;
        width: 42%;

        top: 83%;
        height: 7%;
      }

    }


    /* =====================================================
       PANTALLAS MUY PEQUEÑAS
       ===================================================== */

    @media (max-width: 360px) {

      .ubicacion {
        left: 27%;
        width: 46%;

        top: 76.5%;
        height: 6.5%;
      }

      .confirmar {
        left: 27%;
        width: 46%;

        top: 83%;
        height: 7%;
      }

    }

  </style>
</head>


<body>

  <main class="invitacion">

    <!-- =================================================
         IMAGEN DE LA INVITACIÓN
         ================================================= -->

    <img
      src="Invitacion.png"
      alt="Invitación Baby Shower Ana Sofía"
      class="imagen-invitacion"
    >


    <!-- =================================================
         BOTÓN INVISIBLE SOBRE "VER UBICACIÓN"
         ================================================= -->

    <a
      class="boton-interactivo ubicacion"
      href="https://maps.app.goo.gl/BGQ9y5GhA3HxYcNT8"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ver ubicación"
    >
      Ver ubicación
    </a>


    <!-- =================================================
         BOTÓN INVISIBLE SOBRE "CONFIRMAR ASISTENCIA"
         ================================================= -->

    <a
      class="boton-interactivo confirmar"
      href="https://wa.me/573142999978?text=Hola%2C%20quiero%20confirmar%20mi%20asistencia%20al%20Baby%20Shower%20de%20Ana%20Sof%C3%ADa%20%F0%9F%92%9C"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Confirmar asistencia por WhatsApp"
    >
      Confirmar asistencia
    </a>

  </main>


  <!-- =====================================================
       PEQUEÑO SCRIPT DE SEGURIDAD
       ===================================================== -->

  <script>

    // Evita que una pulsación larga sobre la imagen
    // abra accidentalmente el menú contextual.
    document.querySelector('.imagen-invitacion')
      .addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

  </script>

</body>
</html>
