<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Baby Shower Ana Sofía 💜</title>

<meta property="og:title"
      content="Baby Shower Ana Sofía 💜">

<meta property="og:description"
      content="Tenemos una invitación muy especial para ti 💜">

<meta property="og:type"
      content="website">

<meta property="og:url"
      content="https://srobledog97.github.io/">

<meta property="og:image"
      content="https://srobledog97.github.io/Invitacion.png">


<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    min-height: 100%;

}

body {

    background: #12091c;

    overflow-x: hidden;

}


/* =========================================
   CONTENEDOR PRINCIPAL
========================================= */

.invitacion {

    position: relative;

    width: 100%;

    max-width: 700px;

    margin: 0 auto;

    line-height: 0;

}


/* =========================================
   IMAGEN ORIGINAL
========================================= */

.imagen {

    display: block;

    width: 100%;

    height: auto;

}


/* =========================================
   NOMBRE DEL INVITADO
========================================= */

.nombre-invitado {

    position: absolute;

    /*
       POSICIÓN DEFINITIVA
       ENCONTRADA EN LA PRUEBA
    */

    top: 70%;

    left: 5%;

    width: 90%;

    text-align: center;

    line-height: 1.15;

    color: #65418c;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            18px,
            4.5vw,
            30px
        );

    font-weight: bold;

    z-index: 5;

    pointer-events: none;

}


/* =========================================
   BOTÓN GOOGLE MAPS

   INVISIBLE.
   EL ASPECTO LO PROPORCIONA LA IMAGEN.
========================================= */

.boton-maps {

    position: absolute;

    top: 76.1%;

    left: 29%;

    width: 42%;

    height: 5.7%;

    z-index: 10;

    display: block;

    background: transparent;

    border: none;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;

}


/* =========================================
   BOTÓN WHATSAPP

   INVISIBLE.
   EL ASPECTO LO PROPORCIONA LA IMAGEN.
========================================= */

.boton-whatsapp {

    position: absolute;

    top: 82.1%;

    left: 29%;

    width: 42%;

    height: 5.7%;

    z-index: 10;

    display: block;

    background: transparent;

    border: none;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;

}


/* =========================================
   MÓVILES

   IMPORTANTE:
   TOP SIGUE SIENDO 70%.
========================================= */

@media (max-width: 500px) {

    .nombre-invitado {

        top: 70%;

        left: 4%;

        width: 92%;

        font-size:
            clamp(
                17px,
                4.5vw,
                27px
            );

    }


    /*
       LOS BOTONES NO SE MODIFICAN
    */

    .boton-maps {

        top: 76.1%;

        left: 29%;

        width: 42%;

        height: 5.7%;

    }


    .boton-whatsapp {

        top: 82.1%;

        left: 29%;

        width: 42%;

        height: 5.7%;

    }

}


/* =========================================
   PANTALLAS MUY PEQUEÑAS
========================================= */

@media (max-width: 360px) {

    .nombre-invitado {

        font-size: 17px;

    }

}

</style>

</head>


<body>


<div class="invitacion">


    <!-- =====================================
         IMAGEN ORIGINAL
    ====================================== -->

    <img
        src="Invitacion.png"
        class="imagen"
        alt="Baby Shower Ana Sofía"
    >


    <!-- =====================================
         NOMBRE PERSONALIZADO
    ====================================== -->

    <div
        id="nombreInvitado"
        class="nombre-invitado">
    </div>


    <!-- =====================================
         GOOGLE MAPS
    ====================================== -->

    <a
        class="boton-maps"
        href="https://maps.app.goo.gl/BGQ9y5GhA3HxYcNT8"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Ver ubicación">
    </a>


    <!-- =====================================
         WHATSAPP
    ====================================== -->

    <a
        id="botonWhatsApp"
        class="boton-whatsapp"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Confirmar asistencia">
    </a>


</div>


<script>

/* =========================================
   NOMBRE DE PRUEBA
========================================= */

const nombrePorDefecto =
    "Familia Montoya Agudelo";


/* =========================================
   LEER EL NOMBRE DESDE LA URL
========================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );


let invitado =
    parametros.get("invitado");


/*
   Si no existe un nombre en la URL,
   utilizamos Montoya Agudelo
   como prueba.
*/

if (!invitado) {

    invitado =
        nombrePorDefecto;

}


/* =========================================
   DECODIFICAR EL NOMBRE
========================================= */

try {

    invitado =
        decodeURIComponent(invitado);

} catch (error) {

    /*
       Si ya viene correctamente
       decodificado, no hacemos nada.
    */

}


/* =========================================
   CAMBIAR "FAMILIA" POR "FLIA."
========================================= */

invitado =
    invitado.replace(
        /^Familia\s+/i,
        "Flia. "
    );


/* =========================================
   MOSTRAR EL NOMBRE
========================================= */

document.getElementById(
    "nombreInvitado"
).textContent =
    invitado.trim();


/* =========================================
   WHATSAPP PERSONALIZADO
========================================= */

const numeroWhatsApp =
    "573142999978";


const mensaje =
    "Hola 👋, confirmo mi asistencia al " +
    "Baby Shower de Ana Sofía 💜. " +
    "Soy: " +
    invitado.trim();


const enlaceWhatsApp =
    "https://wa.me/" +
    numeroWhatsApp +
    "?text=" +
    encodeURIComponent(mensaje);


document.getElementById(
    "botonWhatsApp"
).href =
    enlaceWhatsApp;

</script>


</body>

</html>
