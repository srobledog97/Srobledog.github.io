<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Baby Shower Ana Sofía 💜</title>

  <!-- Vista previa al compartir -->
  <meta property="og:title" content="Baby Shower Ana Sofía 💜">
  <meta
    property="og:description"
    content="Acompáñanos a celebrar un dulce Baby Shower"
  >
  <meta property="og:type" content="website">
  <meta
    property="og:url"
    content="https://srobledog97.github.io/"
  >
  <meta
    property="og:image"
    content="https://srobledog97.github.io/Invitacion.png"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #10071b;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    /* CONTENEDOR PRINCIPAL */
    .invitacion {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      line-height: 0;
    }

    /* IMAGEN ORIGINAL */
    .imagen-invitacion {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      ZONA DE PERSONALIZACIÓN

      El nombre aparece encima de la imagen,
      pero sin modificar la imagen original.
    */
    .personalizacion {
      position: absolute;

      /*
        Posición vertical del nombre.
        Se ajusta proporcionalmente al tamaño
        de la imagen.
      */
      top: 67.2%;

      left: 8%;
      width: 84%;

      text-align: center;
      line-height: normal;

      pointer-events: none;
    }

    .para {
      display: block;

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(11px, 2.8vw, 17px);
      font-weight: normal;

      letter-spacing: 1.2px;

      color: #76517d;

      margin-bottom: 5px;

      text-transform: uppercase;

      text-shadow:
        0 1px 1px rgba(255,255,255,0.7);
    }

    .nombre-invitado {
      display: block;

      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(17px, 4.8vw, 31px);

      font-weight: bold;

      color: #76517d;

      line-height: 1.15;

      text-shadow:
        0 1px 1px rgba(255,255,255,0.8);
    }


    /* CONTENEDOR DE BOTONES */
    .botones {
      position: absolute;

      /*
        Los botones se mantienen dentro
        de la propia invitación.
      */
      top: 76.3%;

      left: 50%;
      transform: translateX(-50%);

      width: 55%;

      display: flex;
      flex-direction: column;

      gap: 9px;

      line-height: normal;
    }


    /* BOTONES */
    .boton {

      width: 100%;

      min-height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 10px 18px;

      border-radius: 28px;

      border: 1px solid rgba(255,255,255,0.55);

      /*
        Aspecto parecido a los botones
        originales de la invitación.
      */
      background:
        linear-gradient(
          180deg,
          #8146d6 0%,
          #7134c5 100%
        );

      color: #ffffff;

      text-decoration: none;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: clamp(12px, 3vw, 17px);

      font-weight: 400;

      letter-spacing: 0.2px;

      box-shadow:
        0 3px 6px rgba(54, 20, 85, 0.35),
        inset 0 1px 2px rgba(255,255,255,0.35);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }


    /* ICONOS */
    .icono {
      width: 25px;
      height: 25px;

      flex: 0 0 25px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icono svg {
      width: 24px;
      height: 24px;

      fill: none;

      stroke: white;

      stroke-width: 2;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    /* EFECTO AL TOCAR */
    .boton:active {
      transform: scale(0.97);

      box-shadow:
        0 2px 4px rgba(54, 20, 85, 0.3);
    }


    /*
      En pantallas muy pequeñas reducimos
      ligeramente los botones para que no
      tapen los personajes.
    */
    @media (max-width: 380px) {

      .botones {
        width: 58%;
        gap: 7px;
      }

      .boton {
        min-height: 48px;
        padding: 8px 10px;
        font-size: 11px;
      }

      .icono,
      .icono svg {
        width: 22px;
        height: 22px;
      }

      .personalizacion {
        top: 67%;
      }
    }


    /*
      En tablets y pantallas grandes
    */
    @media (min-width: 701px) {

      .invitacion {
        box-shadow:
          0 0 35px rgba(0,0,0,0.35);
      }

      .personalizacion {
        top: 67.2%;
      }

      .botones {
        top: 76.3%;
        width: 55%;
      }
    }

  </style>
</head>


<body>

  <main class="invitacion">

    <!-- IMAGEN DE LA INVITACIÓN -->
    <img
      src="Invitacion.png"
      alt="Invitación Baby Shower Ana Sofía"
      class="imagen-invitacion"
    >


    <!-- PERSONALIZACIÓN DEL INVITADO -->
    <div class="personalizacion">

      <span class="para">
        Con cariño, para:
      </span>

      <span
        class="nombre-invitado"
        id="nombreInvitado"
      >
        Familia Montoya Agudelo
      </span>

    </div>


    <!-- BOTONES -->
    <div class="botones">

      <!-- GOOGLE MAPS -->
      <a
        class="boton"
        href="https://maps.app.goo.gl/BGQ9y5GhA3HxYcNT8"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icono">

          <svg viewBox="0 0 24 24">

            <path
              d="M12 21s7-6.2 7-12A7 7 0 0 0 5 9c0 5.8 7 12 7 12z"
            />

            <circle
              cx="12"
              cy="9"
              r="2.2"
            />

          </svg>

        </span>

        <span>VER UBICACIÓN</span>

      </a>


      <!-- WHATSAPP -->
      <a
        class="boton"
        id="whatsapp"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icono">

          <svg viewBox="0 0 24 24">

            <path
              d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5z"
            />

            <path
              d="M9.2 8.2c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.6 1.4c.1.2.1.4-.1.6l-.5.6c.5 1 1.3 1.8 2.3 2.3l.6-.5c.2-.2.4-.2.6-.1l1.4.6c.3.1.4.3.4.5v.5c0 .3-.1.5-.4.7-.5.3-1.1.4-1.7.2-2.1-.6-4-2.5-4.6-4.6-.2-.6-.1-1.2.2-1.7z"
            />

          </svg>

        </span>

        <span>CONFIRMAR ASISTENCIA</span>

      </a>

    </div>

  </main>


  <script>

    /*
      DATOS DE LA INVITACIÓN
    */

    const numeroWhatsApp = "573142999978";


    /*
      LEER EL INVITADO DESDE LA URL

      Ejemplo:

      https://srobledog97.github.io/?invitado=Familia%20Montoya%20Agudelo
    */

    const parametros = new URLSearchParams(
      window.location.search
    );

    const invitado =
      parametros.get("invitado");


    /*
      SI EXISTE UN INVITADO EN LA URL,
      CAMBIAMOS AUTOMÁTICAMENTE EL NOMBRE.
    */

    if (invitado && invitado.trim() !== "") {

      document.getElementById(
        "nombreInvitado"
      ).textContent = invitado;

    }


    /*
      MENSAJE AUTOMÁTICO DE WHATSAPP
    */

    const nombreFinal =
      document.getElementById(
        "nombreInvitado"
      ).textContent.trim();


    const mensaje =
      `Hola, confirmo mi asistencia al Baby Shower de Ana Sofía. Invitación para: ${nombreFinal}. 💜`;


    const enlaceWhatsApp =
      "https://wa.me/" +
      numeroWhatsApp +
      "?text=" +
      encodeURIComponent(mensaje);


    document.getElementById(
      "whatsapp"
    ).href = enlaceWhatsApp;

  </script>

</body>
</html>
